name: dates

# Explicit upstream DNS: Docker's embedded DNS went stale after a host network change
# (SearXNG got SERVFAIL until recreated; Recipe Box's Ollama had the same problem).
x-dns: &dns
  dns:
    - 192.168.0.70
    - 1.1.1.1

x-app: &app
  image: dates-app:local
  restart: unless-stopped
  env_file: .env
  <<: *dns
  volumes:
    - /srv/dateplanner:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.db
    image: dates-db:local
    restart: unless-stopped
    environment:
      POSTGRES_DB: dates
      POSTGRES_USER: dates
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    command: postgres -c shared_buffers=256MB -c max_connections=40
    shm_size: 256m
    volumes:
      - dates-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dates -d dates"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    command: ["sh", "/app/start-api.sh"]
    ports:
      - "8820:8820"
    networks:
      - default
      - recipebox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8820/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    # Whisper runs here (the slow path); Ollama stays in Recipe Box's container
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    stop_grace_period: 60s
    volumes:
      - /srv/dateplanner:/data
      - /srv/gpu:/locks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - recipebox

  # Dev instance for UI testing (docs/OPERATIONS.md): database dates_dev, loopback only.
  # DEV_USER skips Authentik, so it must never be set on the public api service.
  api-dev:
    <<: *app
    profiles: ["dev"]
    command: ["sh", "/app/start-api.sh"]
    environment:
      DATABASE_URL: postgresql+psycopg://dates:${PG_PASSWORD}@db:5432/dates_dev
      DEV_USER: zaher
    ports:
      - "127.0.0.1:8821:8820"
    networks:
      - default
      - recipebox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8820/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker-dev:
    <<: *app
    profiles: ["dev"]
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 60s
    runtime: nvidia
    environment:
      DATABASE_URL: postgresql+psycopg://dates:${PG_PASSWORD}@db:5432/dates_dev
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /srv/dateplanner:/data
      - /srv/gpu:/locks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api-dev:
        condition: service_healthy
    networks:
      - default
      - recipebox

  # Geocoder: prebuilt US database (scripts/photon_import.sh)
  photon:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    command: ["java", "-Xmx3g", "-jar", "/photon/photon.jar", "serve",
              "-data-dir", "/photon/data", "-listen-ip", "0.0.0.0", "-listen-port", "2322"]
    volumes:
      - /srv/dateplanner/photon:/photon
    mem_limit: 6g

  # Routing for the date-night picker (scripts/build_osrm.sh)
  osrm-car:
    image: &osrm ghcr.io/project-osrm/osrm-backend:v26.10.0-debian
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "500", "/data/socal.osrm"]
    volumes:
      - /srv/dateplanner/osrm/car:/data:ro
    mem_limit: 3g

  osrm-foot:
    image: *osrm
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "500", "/data/socal.osrm"]
    volumes:
      - /srv/dateplanner/osrm/foot:/data:ro
    mem_limit: 3g

  # Private metasearch for venue websites
  searxng:
    <<: *dns
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 512m

volumes:
  dates-pg:

networks:
  recipebox:
    external: true
    name: foodbox_default
