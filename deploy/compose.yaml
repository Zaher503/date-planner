name: dates

# Explicit upstream DNS: Docker's embedded DNS went stale after a host network change
# (SearXNG got SERVFAIL until recreated).
x-dns: &dns
  dns:
    - 192.168.0.70
    - 1.1.1.1

x-app: &app
  image: ghcr.io/zaher503/date-planner:${DATES_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  <<: *dns
  volumes:
    - /srv/dateplanner:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.db
    image: ghcr.io/zaher503/date-planner-db:${DATES_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: dates
      POSTGRES_USER: dates
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    command: postgres -c shared_buffers=256MB -c max_connections=40
    shm_size: 256m
    volumes:
      - dates-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dates -d dates"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    command: ["sh", "/app/start-api.sh"]
    ports:
      - "8820:8820"
    networks:
      - default
      - ai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8820/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Runs the ingest jobs. The models (LLM and Whisper) live in the shared AI hub, so no GPU here.
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 60s
    environment:
      BROWSER_URL: ws://browser:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - ai

  # Keyed test endpoint for import-tester/server.py: runs the fast-path pipeline on one link
  # at a time with the database stubbed out, same as the desktop tool. Deliberately NOT built
  # from the *app anchor: no /srv/dateplanner volume, no db dependency, and only the env vars
  # below (never DATES_KEY, PG_PASSWORD, HA_TOKEN, etc.) so a bug in this test path can't touch
  # real data or leak the other services' secrets. Reachable only via its own keyed Caddy route
  # (deploy/caddy-snippet.txt), not the Authentik-protected catch-all.
  tester:
    image: ghcr.io/zaher503/date-planner:${DATES_TAG:-latest}
    restart: unless-stopped
    command: ["python", "import-tester/service.py"]
    <<: *dns
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ai-hub:11434}
      BROWSER_URL: ws://browser:3000
      TESTER_KEY: ${TESTER_KEY}
    ports:
      - "8899:8899"
    networks:
      - default
      - ai
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Geocoder: prebuilt US database (scripts/photon_import.sh)
  photon:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    command: ["java", "-Xmx3g", "-jar", "/photon/photon.jar", "serve",
              "-data-dir", "/photon/data", "-listen-ip", "0.0.0.0", "-listen-port", "2322"]
    volumes:
      - /srv/dateplanner/photon:/photon
    mem_limit: 6g

  # Routing for the date-night picker (scripts/build_osrm.sh)
  osrm-car:
    image: &osrm ghcr.io/project-osrm/osrm-backend:v26.10.0-debian
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "500", "/data/socal.osrm"]
    volumes:
      - /srv/dateplanner/osrm/car:/data:ro
    mem_limit: 3g

  osrm-foot:
    image: *osrm
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "500", "/data/socal.osrm"]
    volumes:
      - /srv/dateplanner/osrm/foot:/data:ro
    mem_limit: 3g

  # A real browser for pages that block plain fetching or only show prices after a click. The worker
  # drives it over a websocket and checks every request it makes (app/browser.py), so it is never
  # pointed at the LAN. Keep the playwright version in sync with backend/requirements.txt.
  browser:
    <<: *dns
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    restart: unless-stopped
    init: true
    ipc: host
    user: pwuser
    working_dir: /home/pwuser
    command: ["npx", "-y", "playwright@1.49.1", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    mem_limit: 2g

  # Private metasearch for venue websites
  searxng:
    <<: *dns
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 512m

volumes:
  dates-pg:

# Created by the ai-hub stack (https://github.com/Zaher503/ai-hub)
networks:
  ai:
    external: true
    name: ai
