name: CI

on:
  push:
    branches: [main]
    # Docs-only changes skip CI, so CD does not bump the version or redeploy.
    # tests/test_api_docs.py reads docs/API.md; a docs-only edit is only checked on the next code change.
    paths-ignore: ["**.md", "improvements/**", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "improvements/**", "docs/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest ruff==0.17.4
      - name: Lint
        run: ruff check backend  # rules in backend/ruff.toml
      - name: Tests
        working-directory: backend
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: |
          touch deploy/.env
          PG_PASSWORD=x SEARXNG_SECRET=x docker compose -f deploy/compose.yaml config -q
      - uses: docker/setup-buildx-action@v3
      - name: Build the app image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
