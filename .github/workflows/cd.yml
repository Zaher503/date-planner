name: CD

# After CI passes on main: add 0.1 to frontend/VERSION, publish the images to GHCR with that number,
# update the stack on the Zephyrus, and commit the new number back to main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# One deploy at a time, so two runs never pick the same version
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: next
        run: |
          old=$(tr -d '[:space:]' < frontend/VERSION)
          echo "next=$(awk -v v="$old" 'BEGIN { printf "%.2f", v + 0.1 }')" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: date-planner
            dockerfile: deploy/Dockerfile.app
          - image: date-planner-db
            dockerfile: deploy/Dockerfile.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Stamp the new version
        run: echo "${{ needs.version.outputs.next }}" > frontend/VERSION
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/zaher503/${{ matrix.image }}:latest
            ghcr.io/zaher503/${{ matrix.image }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Keep main's number in step with what was just published (a push with the built-in token starts no workflow)
  bump:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Commit the new version
        run: |
          echo "${{ needs.version.outputs.next }}" > frontend/VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/VERSION
          git commit -m "Bump version to v${{ needs.version.outputs.next }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: publish
    # Self-hosted runner on the Zephyrus; only ever triggered from main, never from pull requests
    runs-on: [self-hosted, date-planner]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Update the stack
        run: |
          install -d /opt/date-planner
          rm -rf /opt/date-planner/deploy.new
          cp -r deploy /opt/date-planner/deploy.new
          # The real .env stays on the server, outside the repo
          ln -sf /home/zaher/dateplanner/.env /opt/date-planner/deploy.new/.env
          rm -rf /opt/date-planner/deploy.old
          [ -d /opt/date-planner/deploy ] && mv /opt/date-planner/deploy /opt/date-planner/deploy.old
          mv /opt/date-planner/deploy.new /opt/date-planner/deploy
          echo "$SHA" > /opt/date-planner/REVISION
          cd /opt/date-planner/deploy
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          export DATES_TAG=latest
          # The dev copies moved to the desktop (dev/compose.yaml); remove the ones left on this host
          docker rm -f dates-api-dev-1 dates-worker-dev-1 2>/dev/null || true
          docker compose pull api db worker
          docker compose up -d --remove-orphans
          docker image prune -f
      - name: Health check
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8820/healthz && exit 0
            sleep 3
          done
          docker compose -f /opt/date-planner/deploy/compose.yaml logs --tail 50 api
          exit 1
