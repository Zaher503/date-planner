<html><head><title>t</title><meta property="og:title" content="Los Angeles Hiking Group | Meetup" data-next-head=""/><meta property="og:description" content="L.A. Hiking Group is for people looking to meet others interested in walking or hiking for exercise and attending other fun events such as stair climbing, trail running, bicycling, kayaking, skiing, river rafting, etc.We also host BBQs, parties and other social gatherings. We may even go on exotic v" data-next-head=""/><meta property="og:image" content="https://secure.meetupstatic.com/photos/event/1/7/a/1/600_536526049.jpeg" data-next-head=""/><script type="application/ld+json" data-next-head="">{"@type":"Organization","@context":"https://schema.org","url":"https://www.meetup.com/los-angeles-hiking-group/","name":"Meetup","logo":"https://secure.meetupstatic.com/next/images/general/m_redesign_630x630.png","sameAs":["https://www.facebook.com/meetup/","https://twitter.com/Meetup/","https://www.youtube.com/meetup","https://www.instagram.com/meetup/"]}</script><script type="application/ld+json" data-next-head="">[{"@context":"https://schema.org","@type":"Event","name":"Mt. Waterman Trail Maintenance","url":"https://www.meetup.com/los-angeles-hiking-group/events/316760628/","description":"This is a great opportunity to combine your love of the outdoors with the gratification of making a significant contribution to the environment.\n\nWe will be giving this trail some much needed TLC. There are trees that need to be cleared and storm damaged tread repairs. Hike will be up to 7 miles round with 2000' gain from starting from the Buckhorn Trailhead. Shorter hike options also possible.\n\nPants & long-sleeved shirt, good boots/hiking shoes are required. Hard hat, gloves and safety glasses can be provided. Please be sure to bring plenty of water and your lunch.\n\nEvent will be cancelled if it rains.","startDate":"2026-10-10T14:30:00.000Z","endDate":"2026-10-10T23:30:00.000Z","eventStatus":"https://schema.org/EventScheduled","image":"","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"ANGELES CREST HIGHWAY","address":{"@type":"PostalAddress","addressLocality":"ALTADENA","addressRegion":"CA","addressCountry":"us","streetAddress":"4816 ANGELES CREST HIGHWAY, ALTADENA, CA"}},"organizer":{"@type":"Organization","name":"Los Angeles Hiking Group","url":"https://www.meetup.com/los-angeles-hiking-group/"},"performer":"Los Angeles Hiking Group"},{"@context":"https://schema.org","@type":"Event","name":"Perfect Weather Hike in Griffith Park! ☀️🙋🏻‍♀️ 🙋 🙋🏽‍♂️","url":"https://www.meetup.com/los-angeles-hiking-group/events/316650549/","description":"Come join the Perfect Weather Hike in Griffith Park every Saturday (location or route varies). Join us on this friendly social hike, with optional plank challenge at the helipad. Followed by optional breakfast/lunch at the Village Bakery and Cafe.\n\nTrail Is a roughly a 4.5 mile 10,000 step loop on mostly fire roads. Distance varies depending on trail variations. We’ll have views across the city to the Pacific Ocean, Griffith Observatory, downtown LA... Moderate hike on the main fire roads with Tiffany or option for advanced inclines with Gary.\n\nRoute varies: Cadman trail to 5-Points, Beacon Hill, Helipad/Viewpoint, Glendale Peak, Cedar Grove, down Commonwealth and through neighborhood back to the cars.\n\nSteady incline approx 700ft elevation gain in the first hour - challenging for beginners but worth it! We’ll gather at each split in the trail to make sure all are accounted for.\n\nDog friendly 🐕. Just remember there are coyotes in the park.\n\nMeet afterwards at Village Bakery and Cafe\n3119 Los Feliz Blvd, Los Angeles, CA 90039\n\nLike all meetups, hike at your own risk. You are responsible for your own well-being. Please bring water, wear sunscreen and proper shoes.\n\nFacebook group\nhttps://m.facebook.com/groups/1608982546701615/?ref=share&mibextid=S66gvF\n\nMeeting point is in a residential neighborhood with street parking.\nThere is NO restroom on this hike. The nearest is at the Griffith park Southern Railway by the Griffith Park Cafe on Crystal Springs Drive. If you arrive early, It’s a 15 minute roundtrip walk to the restroom.\n\nHike will be cancelled in the event of rain and soggy trails or severe heat advisories.","startDate":"2026-10-10T16:00:00.000Z","endDate":"2026-10-10T18:30:00.000Z","eventStatus":"https://schema.org/EventScheduled","image":"","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"End of Griffith Park Blvd at Shannon Rd and Cadman Dr","address":{"@type":"PostalAddress","addressLocality":"Los Angeles","addressRegion":"CA","addressCountry":"US","streetAddress":"3610 Griffith Park Blvd,, Los Angeles, CA"}},"organizer":{"@type":"Organization","name":"Los Angeles Hiking Group","url":"https://www.meetup.com/los-angeles-hiking-group/"},"performer":"Los Angeles Hiking Group"},{"@context":"https://schema.org","@type":"Event","name":"8th Annual Culver City Arts Festival 2026 (free)","url":"https://www.meetup.com/los-angeles-hiking-group/events/316217144/","description":"8th Annual Culver City Arts Festival\nSaturday, October 10, 2026\n\nNow in its eighth year, this FREE Festival brings the streets to life with live art-making, artisan vendors, nonstop music, food trucks, beer gardens, and fun for all ages!\n\nStroll Washington Boulevard for art booths, live performances, food, family activities, and a full day of Culver City Arts District energy.\n\nThis FREE Festival will feature:\nDistinguished artists\nLive music\nEclectic food trucks\nBeer gardens\nKid's activities\n\nEvents will take place throughout Culver City Arts District, including a designated street closure that stretches along the Arts District (Washington Blvd will be closed between La Cienega Ave and Hutchison Ave).\n\nVisit established art galleries with special installations, explore the popup marketplace featuring arts and crafts vendors, and enjoy the neighborhood block party.\n\n[[ 11:30 am ]] === meet North Hollywood metro station (picture shown)\n5391 Lankershim Blvd, North Hollywood, CA 91601\n\n[[ 11:45 am ]] === get on B red line metro and head towards \"7th street metro center\" station, 30 minute ride.\n\n[[ 12:35 pm ]] === meet in \"7th street metro center\", Los Angeles, CA 90017\n\n[[ 12:50 pm ]] === depart 7th&metro and catch E line metro towards Culver City station, it will take us 30 minutes.\n\n[[ 1:30 pm ]] === exit subway train and walk towards \"Washington Blvd & Helms Ave\" a 7 minute, 0.3 mile, walk to the start of the street festival.\n\nSubway metro trains run till midnight, feel free to return when ever you want.\n\nYou can park your car at North Hollywood metro station parking lot, make sure you pay the 3 dollar parking fee if not you will get a fifty-three dollar ticket. Alternatively if you own an old car and don't want to pay for parking, you can park at \"Winnetka&Pierce college\" station and take G orange line bus to NH metro station, bus ride takes around forty-five minutes.\n\nNeed a TAP card for G-orange line bus, and will need one for B-red line and E-expo lines. Can buy it from the machine at NH or 7th & metro for 2 dollar, also load it with at least 3.50 dollar for our trips, one trip is valid for two hours with free transfer within two hours. Will cost you $1.75 dollar each way.\n\nhttps://culvercityartsfestival.com/MAP.jpg\n\n[https://culvercityartsfestival.com](https://culvercityartsfestival.com/)\n\nEnd.\n\nLiability Notice:\nAssistant Organizers, Event Hosts, and support hikers are volunteers and organize hikes without compensation and assume no responsibility for participants or guests. By signing up, you acknowledge the risks associated with outdoor activities and agree to release and discharge the Organizer, Assistant Organizers, and Event Hosts of the Los Angeles Hiking & Fitness Meetup Group from any liability arising from participation.\nPlease see Meetup’s Terms of Service: [https://www.meetup.com/terms/](https://www.meetup.com/terms/)","startDate":"2026-10-10T18:30:00.000Z","endDate":"2026-10-11T01:00:00.000Z","eventStatus":"https://schema.org/EventScheduled","image":"","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"North Hollywood Metro Station","address":{"@type":"PostalAddress","addressLocality":"North Hollywood","addressRegion":"CA","addressCountry":"US","streetAddress":"5391 Lankershim Blvd, North Hollywood, CA 91601, North Hollywood, CA"}},"organizer":{"@type":"Organization","name":"Los Angeles Hiking Group","url":"https://www.meetup.com/los-angeles-hiking-group/"},"performer":"Los Angeles Hiking Group"},{"@context":"https://schema.org","@type":"Event","name":"Placerita canyon: level 5 miles & Thai for dinner","url":"https://www.meetup.com/los-angeles-hiking-group/events/316864383/","description":"We will first explore the trail behind the nature center (15 minutes) then the hike follows a shady creekbed for a total of 5 miles. Expected weather is 79 degrees, light rain is possible\n\nbring a guitar and/or earplugs, water, and shoes that can get wet as there are several creek crossings.\n\npost hike dinner is at Thai Yaki. Located on Lyons ave. just east of the 5 freeway, the driveway is between a Shell and a Chevron gas station.\n[https://maps.app.goo.gl/3KquWHAnUDAu3yQL7](https://maps.app.goo.gl/3KquWHAnUDAu3yQL7)","startDate":"2026-10-10T22:00:00.000Z","endDate":"2026-10-11T01:00:00.000Z","eventStatus":"https://schema.org/EventScheduled","image":"","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Placerita Canyon County Park","address":{"@type":"PostalAddress","addressLocality":"Newhall","addressRegion":"CA","addressCountry":"us","streetAddress":"19152 Placerita Canyon Rd, Newhall, CA"}},"organizer":{"@type":"Organization","name":"Los Angeles Hiking Group","url"
